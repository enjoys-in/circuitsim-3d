[project]
name = "circuitsim-backend"
version = "0.1.0"
description = "Open-source AI electronics simulator backend (FastAPI)"
authors = [{ name = "CircuitSim", email = "dev@circuitsim.local" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "greenlet>=3.0",
    "mcp>=2,<3",
]

[project.scripts]
seed = "app.seed.seeder:main"

# App deployed from source (entrypoint app.main:app) — don't build/install the root package.
[tool.uv]
package = false

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.5"
mypy = ">=1.10"
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
